name: ML Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
    paths:
      - 'src/**'
      - 'config/**'
      - 'notebooks/**'
      - 'main.py'
      - 'requirements.txt'
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      config_override:
        description: 'Optional path to alternate config'
        required: false

permissions:
  contents: read

env:
  DB_HOST: ${{ secrets.DB_HOST }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

jobs:
  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - run: |
          python -m pip install --upgrade pip
          pip install flake8
      - run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  train-and-evaluate:
    needs: [code-quality]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONHASHSEED: '42'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - run: pip install -r requirements.txt

      - name: Download sample data
        run: |
          # Bug #3: data/1_raw is gitignored; use a committed sample instead
          # Option A: use a small committed sample
          if [ -d "data/sample_path" ]; then
            cp -r data/sample_path/* data/1_raw/ 2>/dev/null || mkdir -p data/1_raw && cp -r data/sample_path/* data/1_raw/
          fi
          # Option B (uncomment if using S3):
          # aws s3 cp s3://${{ secrets.S3_BUCKET }}/sample_path/ data/1_raw/ --recursive

      - name: Validate data schema
        run: |
          python -c "
          import pandas as pd
          from pathlib import Path
          files = list(Path('data/1_raw').glob('*.csv'))
          assert files, 'No raw data found'
          df = pd.concat([pd.read_csv(f) for f in files])
          print(f'Data OK: {df.shape}')
          assert df['target'].notna().sum() > 0, 'Missing target column'"

      - name: Run pipeline
        run: python main.py ${config_override:+--config "$config_override"}
        env:
          config_override: ${{ github.event.inputs.config_override }}

      - name: Model quality gate
        run: |
          python -c "
          import json, sys
          with open('results/metrics.json') as f:
              metrics = json.load(f)
          for name, m in metrics.items():
              if m['r_squared'] < 0.70:
                  print(f'FAIL: {name} R²={m[\"r_squared\"]:.4f} < 0.70 threshold')
                  sys.exit(1)
          print('All models pass quality gate.')
          "

      - name: Upload results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ github.sha }}
          path: |
            results/figures/
            results/comparison_summary.csv
            results/final_report.json
          retention-days: 30
